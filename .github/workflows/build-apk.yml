name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch: # Allow manual builds from the GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ebook-reader-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A release gives a plain .apk link that opens on a phone, which artifacts (zip files,
      # not downloadable from the GitHub mobile app) do not.
      - name: Name APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/release/app-release.apk myboox-${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Myboox build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download the .apk below on your Android device and open it to install.
            ดาวน์โหลดไฟล์ .apk ด้านล่างบนเครื่อง Android แล้วเปิดเพื่อติดตั้ง
          files: myboox-${{ github.run_number }}.apk
          make_latest: true
